<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Navbar UI</title>

  <!-- Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f3f4f6;
      height:100vh;
    }

    /* NAVBAR */
    nav{
      width:100%;
      background:#0f172a;
      padding:18px 60px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
    }

    /* LOGO */
    .logo{
      color:white;
      font-size:28px;
      font-weight:bold;
      letter-spacing:1px;
    }

    .logo span{
      color:#38bdf8;
    }

    /* MENU */
    .nav-links{
      display:flex;
      list-style:none;
      gap:35px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-size:17px;
      transition:0.3s;
      position:relative;
    }

    /* Hover Underline */
    .nav-links a::after{
      content:'';
      width:0%;
      height:2px;
      background:#38bdf8;
      position:absolute;
      left:0;
      bottom:-5px;
      transition:0.3s;
    }

    .nav-links a:hover::after{
      width:100%;
    }

    .nav-links a:hover{
      color:#38bdf8;
    }

    /* BUTTON */
    .btn{
      padding:10px 22px;
      border:none;
      border-radius:8px;
      background:#38bdf8;
      color:white;
      font-size:15px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#0ea5e9;
      transform:scale(1.05);
    }

    /* HERO SECTION */
    .hero{
      display:flex;
      justify-content:center;
      align-items:center;
      height:85vh;
      text-align:center;
      padding:20px;
    }

    .hero-content h1{
      font-size:55px;
      color:#0f172a;
      margin-bottom:20px;
    }

    .hero-content p{
      font-size:20px;
      color:#475569;
      margin-bottom:30px;
    }

    .hero-btn{
      padding:14px 28px;
      background:#0f172a;
      color:white;
      border:none;
      border-radius:10px;
      font-size:17px;
      cursor:pointer;
      transition:0.3s;
    }

    .hero-btn:hover{
      background:#1e293b;
    }

    /* MOBILE */
    .menu-icon{
      display:none;
      color:white;
      font-size:24px;
      cursor:pointer;
    }

    @media(max-width:768px){

      nav{
        padding:18px 25px;
      }

      .nav-links{
        display:none;
      }

      .btn{
        display:none;
      }

      .menu-icon{
        display:block;
      }

      .hero-content h1{
        font-size:38px;
      }

      .hero-content p{
        font-size:16px;
      }
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>

    <div class="logo">Web<span>UI</span></div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <button class="btn">Login</button>

    <div class="menu-icon">
      <i class="fa-solid fa-bars"></i>
    </div>

  </nav>

  <!-- HERO SECTION -->
  <section class="hero">

    <div class="hero-content">

      <h1>Modern Navigation Bar UI</h1>

      <p>
        Responsive and attractive navbar design using HTML & CSS
      </p>

      <button class="hero-btn">Explore More</button>

    </div>

  </section>

</body>
</html>
